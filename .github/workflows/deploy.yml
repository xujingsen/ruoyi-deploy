
name: Deploy RuoYi Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ① 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # ② 安装 JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # ③ Maven 打包
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # ④ 把 jar 包传到服务器
      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "ruoyi-admin/target/ruoyi-admin.jar"
          target: "/www/wwwroot/ruoyi/"
          strip_components: 2

      # ⑤ 在服务器上重启服务
      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /www/wwwroot/ruoyi
            # 杀掉旧进程
            PID=$(ps -ef | grep 'ruoyi-admin.jar' | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
              kill -9 $PID
              sleep 3
            fi
            # 启动新进程
            nohup java -jar ruoyi-admin.jar > ruoyi.log 2>&1 &
            sleep 5
            echo "部署完成，当前进程："
            ps -ef | grep ruoyi-admin.jar | grep -v grep